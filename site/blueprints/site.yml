title: Site

# Same palette as fields/hero.yml — YAML anchors don't cross files, so keep the
# two lists in sync (or update both) when a project defines its own brand colors.
.cta-swatches: &ctaSwatches
  "#ffffff": White
  "#fafafa": Neutral 50
  "#f5f5f5": Neutral 100
  "#e5e5e5": Neutral 200
  "#a3a3a3": Neutral 400
  "#404040": Neutral 700
  "#262626": Neutral 800
  "#171717": Neutral 900
  "#000000": Black

tabs:
  content:
    label: Content
    sections:
      pages:
        type: pages
        sortable: true

  header:
    label: Header
    fields:
      ctaHeadline:
        type: headline
        label: Call to action

      ctaIcon:
        label: Icon
        type: icon
        folder: assets/icons
        max: 1

      ctaLabel:
        label: Label
        type: text

      ctaUrl:
        label: URL
        type: link
        options: [url, email, tel, anchor]

      ctaColor:
        label: Button color
        type: color
        options: *ctaSwatches
        default: "#262626"
        width: 1/2

      ctaTextColor:
        label: Text color
        type: color
        options: *ctaSwatches
        default: "#ffffff"
        width: 1/2

      heroHeadline:
        type: headline
        label: Homepage hero section
        help: Only rendered on the homepage.

      hero:
        extends: fields/hero

  companyInfo:
    label: Company information
    fields:
      companyHeadline:
        type: headline
        label: Company information

      logo:
        label: Site logo
        type: files
        multiple: false
        query: site.images
        help: Shown in the header in place of the site title, if set.

      companyName:
        label: Company name
        type: text

      companyAddress:
        label: Address
        type: textarea
        size: small

      companyPhone:
        label: Phone
        type: text

      email:
        label: Email
        type: email

      legalHeadline:
        type: headline
        label: Legal pages

      legalPages:
        label: Legal pages
        type: structure
        fields:
          page:
            label: Page
            type: pages
            multiple: false
            required: true

      socialHeadline:
        type: headline
        label: Social links

      social:
        label: Social links
        type: structure
        fields:
          icon:
            label: Icon
            type: icon
            folder: assets/icons
            max: 1
          label:
            label: Label
            type: text
            required: true
          url:
            label: URL
            type: link
            options: [url, email, tel, anchor]
            required: true
        columns:
          icon:
            width: 1/6
          label:
            width: 2/6
          url:
            width: 3/6
