title: Default Page

tabs:
  content:
    label: Content
    columns:
      main:
        width: 2/3
        sections:
          fields:
            type: fields
            fields:
              text:
                type: blocks
      sidebar:
        width: 1/3
        sections:
          pages:
            type: pages
            template: default
          files:
            type: files
          extraFields:
            type: fields
            fields:
              pageExcerpt:
                label: Page excerpt
                type: textarea
                buttons: false
                size: small
              cardImage:
                label: Miniatura Pagina
                type: files
                max: 1
                layout: cards
                image:
                  ratio: 6/4
                  cover: true
  hero:
    label: Hero
    fields:
      heroToggle:
        label: Show hero section
        type: toggle
        text:
          - "Off"
          - "On"
        help: Ignored on the homepage — the homepage's hero is configured in Site Settings → Header.

      hero:
        extends: fields/hero
        when:
          heroToggle: true
